<h1 class="mb-3">Category Management</h1>

<!-- Formulaire de recherche -->
<form (ngSubmit)="searchCategories()" class="mb-4">
  <div class="row g-3">
    <div class="col-md-3">
      <input [(ngModel)]="filters.name" name="name" type="text" class="form-control" placeholder="Search by name">
    </div>
    <div class="col-md-3">
      <select [(ngModel)]="filters.isRoot" name="isRoot" class="form-control">
        <option value="">Is Root Category</option>
        <option [value]="true">Yes</option>
        <option [value]="false">No</option>
      </select>
    </div>
    <div class="col-md-3">
      <input [(ngModel)]="filters.createdAfter" name="createdAfter" type="date" class="form-control" placeholder="Created After">
    </div>
    <div class="col-md-3">
      <input [(ngModel)]="filters.createdBefore" name="createdBefore" type="date" class="form-control" placeholder="Created Before">
    </div>
  </div>
  <div class="row g-3 mt-2">
    <div class="col-md-3">
      <input [(ngModel)]="filters.childCategoryCount" name="childCategoryCount" type="number" class="form-control" placeholder="Child Count">
    </div>
    <div class="col-md-3">
      <select [(ngModel)]="filters.sortBy" name="sortBy" class="form-control">
        <option value="">Sort By</option>
        <option value="name">Name</option>
        <option value="date">Creation Date</option>
        <option value="childCount">Child Count</option>
      </select>
    </div>
    <div class="col-md-3">
      <button type="submit" class="btn btn-primary">Search</button>
      <button type="button" class="btn btn-secondary" (click)="resetFilters()">Reset</button>
    </div>
  </div>
</form>

<!-- Tableau des catégories -->
<div class="table-responsive mt-4">
  <table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Creation Date</th>
      <th>Parent Category</th>
      <th>Is Root</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <!-- Afficher les résultats de recherche si disponibles -->
    <tr *ngFor="let cat of ((searchResults$ | async) || (allCategory$ | async) || [])">
    <td>{{ cat.id }}</td>
      <td>{{ cat.name }}</td>
      <td>{{ cat.creationDate | date }}</td>
      <td>{{ cat.parentCategory?.id || 'N/A' }}</td>
      <td>{{ cat.parentCategory ? 'No' : 'Yes' }}</td>
      <td>
        <button class="btn btn-primary btn-sm me-1" (click)="navigateToDetails(cat)">Details</button>
        <button class="btn btn-warning btn-sm me-1" (click)="navigateToEdit(cat)">Edit</button>
        <button class="btn btn-danger btn-sm" (click)="cat.id ? deleteCategory(cat.id) : null">Delete</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
